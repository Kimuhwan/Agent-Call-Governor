name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install PyYAML
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run policy evaluations
        run: python evals/run_evals.py
      - name: Validate Codex skill
        run: |
          python - <<'PY'
          import pathlib
          import re
          import yaml

          path = pathlib.Path("agent-call-governor/SKILL.md")
          content = path.read_text(encoding="utf-8")
          match = re.match(r"^---\n(.*?)\n---\n", content, re.DOTALL)
          assert match, "SKILL.md must start with YAML frontmatter"
          metadata = yaml.safe_load(match.group(1))
          assert set(metadata) == {"name", "description"}
          assert metadata["name"] == "agent-call-governor"
          assert metadata["description"].strip()
          print("Skill metadata is valid")
          PY
