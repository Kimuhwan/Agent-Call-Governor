name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install core and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run policy evaluations
        run: python evals/run_evals.py
      - name: Run runtime replay evaluations
        run: python evals/run_runtime_evals.py
      - name: Run instrumentation evaluations
        run: python evals/run_instrumentation_evals.py

  optional-agents-sdk:
    name: OpenAI Agents SDK adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional Agents SDK integration
        run: python -m pip install -e ".[agents]"
      - name: Run SDK adapter tests
        run: python -m unittest tests.test_agents_sdk_adapter -v

  package-and-skill:
    name: Package and Codex skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build and validator dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify product versions
        run: python scripts/check_versions.py
      - name: Validate plugin and release contracts
        run: python -m unittest tests.test_plugin_package tests.test_release_package -v
      - name: Validate Codex skill metadata
        run: |
          python - <<'PY'
          import pathlib
          import re
          import yaml

          path = pathlib.Path("skills/agent-call-governor/SKILL.md")
          content = path.read_text(encoding="utf-8")
          match = re.match(r"^---\n(.*?)\n---\n", content, re.DOTALL)
          assert match, "SKILL.md must start with YAML frontmatter"
          metadata = yaml.safe_load(match.group(1))
          assert set(metadata) == {"name", "description"}
          assert metadata["name"] == "agent-call-governor"
          assert metadata["description"].strip()
          print("Skill metadata is valid")
          PY
      - name: Build wheel and source distribution
        run: python -m build
      - name: Build tracked-file plugin archive
        run: python scripts/build_plugin_archive.py --output dist/agent-call-governor-plugin-0.3.0.zip
      - name: Upload release candidates
        uses: actions/upload-artifact@v7
        with:
          name: agent-call-governor-v0.3.0-python-3.14
          if-no-files-found: error
          path: |
            dist/agent_call_governor_runtime-0.3.0-py3-none-any.whl
            dist/agent_call_governor_runtime-0.3.0.tar.gz
            dist/agent-call-governor-plugin-0.3.0.zip
